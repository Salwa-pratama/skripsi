version: '3.8'

services:
  mysql:
    image: docker.io/library/mysql:8.0
    container_name: asisten_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: asisten_belajar_db
      MYSQL_USER: asisten
      MYSQL_PASSWORD: asisten123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: docker.io/phpmyadmin/phpmyadmin:latest
    container_name: asisten_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword123
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
    driver: local

